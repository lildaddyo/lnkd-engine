<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedIn Engine Dashboard</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#1b1b19;--mut:#6a6a64;--line:#e3e3dc;--acc:#2b5fd9;--g:#1f9d55;--o:#c98a00;--r:#c8372d;--c1:#2b5fd9;--c2:#1f9d55;--c3:#c98a00;--c4:#8a4fd1}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecece7;--mut:#9a9a92;--line:#33332f;--acc:#7aa2ff;--g:#4cc884;--o:#e0aa2e;--r:#ff7b70;--c1:#7aa2ff;--c2:#4cc884;--c3:#e0aa2e;--c4:#b88af0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:18px 24px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}h1{margin:0;font-size:22px}.sub{color:var(--mut);font-size:13px}
nav{padding:12px 24px 0;display:flex;gap:6px;flex-wrap:wrap}nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:14px 24px 40px}section{display:none}section.on{display:block}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.k2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.card h3{margin:0 0 10px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:28px;display:block}.kpi span{color:var(--mut);font-size:12px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bar .l{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .t{flex:1;background:var(--line);border-radius:5px;height:14px;overflow:hidden;display:flex}.bar .t i{display:block;height:100%}.bar .n{width:56px;text-align:right;color:var(--mut);flex:none}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}th{color:var(--mut);font-size:12px;cursor:pointer}
.wrapt{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}a{color:var(--acc);text-decoration:none}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:12px;margin:6px 0}.warn{border-left:3px solid var(--o);padding:8px 12px;background:var(--card);border-radius:6px;margin:10px 0}
.t{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;color:#fff}.P1{background:#1f9d55}.P2{background:#2b5fd9}.P3{background:#c98a00}.P4{background:#888}
.f{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}select,input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.asm label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}.asm input{width:90px;text-align:right}
.big{font-size:30px;font-weight:700}
</style></head><body>
<header><div><h1>LinkedIn Engine Dashboard</h1><div class="sub" id="sub"></div></div><div class="sub">Private. Local file. Rebuild: py -m engine dashboard</div></header>
<nav id="nav"></nav>
<main>
<section id="s_overview"></section><section id="s_pipe"></section><section id="s_targets"></section><section id="s_accounts"></section><section id="s_camp"></section><section id="s_quality"></section>
</main>
<script>
const A=__DATA__;
const SEG=A.labels;
const ST={VRX:'VR Express',AICON:'AI Consultancy',AIBLD:'AI Builds',PARTN:'Partnerships','-':'No stream'};
const SC={VRX:'var(--c1)',AICON:'var(--c2)',AIBLD:'var(--c3)',PARTN:'var(--c4)','-':'var(--line)'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0=x=>(x||0).toLocaleString();
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
function bars(rows,color,max){max=max||Math.max(1,...rows.map(r=>r[1]));return rows.map(r=>'<div class="bar"><div class="l" title="'+esc(r[0])+'">'+esc(r[0])+'</div><div class="t"><i style="width:'+(100*r[1]/max)+'%;background:'+(r[2]||color||'var(--acc)')+'"></i></div><div class="n">'+n0(r[1])+'</div></div>').join('')}
function stack(parts){const tot=sum(parts.reduce((o,p)=>(o[p[0]]=p[1],o),{}))||1;return '<div class="bar"><div class="t" style="height:20px">'+parts.map(p=>'<i title="'+esc(p[0])+' '+p[1]+'" style="width:'+(100*p[1]/tot)+'%;background:'+p[2]+'"></i>').join('')+'</div></div>'}
const tabs=[['overview','Overview'],['pipe','Pipeline model'],['targets','Top targets'],['accounts','Accounts'],['camp','Campaign analytics'],['quality','Data quality']];
const nav=document.getElementById('nav');
tabs.forEach(t=>{const b=document.createElement('button');b.textContent=t[1];b.dataset.t=t[0];b.onclick=()=>show(t[0]);nav.appendChild(b)});
function show(t){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s_'+t));nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));try{localStorage.setItem('tab',t)}catch(e){}}
document.getElementById('sub').textContent=n0(A.total)+' contacts analysed · excluded '+Object.entries(A.excluded).map(e=>e[1]+' '+e[0]).join(', ');

// OVERVIEW
(function(){const p12=(A.tiers.P1||0)+(A.tiers.P2||0);const dormant=A.warmth_p12['dormant (1y+)']||0;const hi=A.value_p12['High (enterprise)']||0;
let h='<div class="grid k4"><div class="card kpi"><b>'+n0(A.total)+'</b><span>contacts scored</span></div><div class="card kpi"><b>'+n0(p12)+'</b><span>P1 + P2 priority targets ('+(100*p12/A.total).toFixed(1)+'%)</span></div><div class="card kpi"><b>'+n0(hi)+'</b><span>high-value enterprise targets</span></div><div class="card kpi"><b>'+n0(dormant)+'</b><span>of the priority targets are dormant 1y+ (reactivation, not hot leads)</span></div><div class="card kpi"><b>'+n0(A.crm_clients)+'</b><span>past clients matched from the CRM'+(A.crm_clients?'':' (import data/crm_warm.csv to add them)')+'</span></div></div>';
h+='<div class="grid k2" style="margin-top:12px"><div class="card"><h3>Priority targets (P1+P2) by revenue stream</h3>'+bars(['VRX','AICON','PARTN','AIBLD'].map(s=>[ST[s],(A.stream_tier[s].P1||0)+(A.stream_tier[s].P2||0),SC[s]]))+'<div class="note">Primary stream = best first offer for that person.</div></div>';
h+='<div class="card"><h3>Segments (all contacts)</h3>'+bars(Object.entries(A.seg_tier).map(([s,t])=>[SEG[s]||s,sum(t)]).sort((a,b)=>b[1]-a[1]))+'</div>';
h+='<div class="card"><h3>Priority targets by vertical</h3>'+bars(Object.entries(A.vertical_p12).sort((a,b)=>b[1]-a[1]))+'</div>';
h+='<div class="card"><h3>Relationship warmth of priority targets</h3>'+bars(Object.entries(A.warmth_p12).sort((a,b)=>b[1]-a[1]))+'<div class="note">Most of the value is in dormant ties. Sequence a "what is new" reactivation, not a cold pitch.</div></div></div>';
h+='<div class="card" style="margin-top:12px"><h3>Segment x tier</h3><table class="heat"><tr><th>Segment</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>Total</th></tr>'+Object.entries(A.seg_tier).sort((a,b)=>sum(b[1])-sum(a[1])).map(([s,t])=>{const mx=sum(t);return '<tr><td>'+esc(SEG[s]||s)+'</td>'+['P1','P2','P3','P4'].map(k=>'<td class="h" style="background:rgba(43,95,217,'+Math.min(.5,(t[k]||0)/Math.max(1,mx)*.9)+')">'+n0(t[k])+'</td>').join('')+'<td class="h"><b>'+n0(mx)+'</b></td></tr>'}).join('')+'</table></div>';
document.getElementById('s_overview').innerHTML=h})();

// PIPELINE MODEL (assumption driven)
(function(){const defs={VRX:12000,AICON:6000,AIBLD:5000,PARTN:3000};
let h='<div class="warn"><b>This is a scenario model, not a forecast.</b> Reply rate, meeting rate, win rate and deal sizes below are placeholder assumptions I made up. Replace them with your real numbers; the results update live. Deal sizes are in EUR.</div><div class="grid k2"><div class="card asm"><h3>Assumptions</h3><label>Reply rate (touched to replied, %)<input id="a_rr" type="number" value="8"></label><label>Replies to meetings (%)<input id="a_mt" type="number" value="30"></label><label>Meetings to won (%)<input id="a_wn" type="number" value="20"></label><label>Share of tier reached: P1 / P2 (%)<input id="a_reach" type="number" value="100"></label>'+Object.keys(defs).map(s=>'<label>Avg first deal, '+ST[s]+'<input id="d_'+s+'" type="number" value="'+defs[s]+'"></label>').join('')+'</div><div class="card"><h3>Modelled outcome (P1 + P2 only)</h3><div id="pm"></div></div></div>';
document.getElementById('s_pipe').innerHTML=h;
function calc(){const g=id=>+document.getElementById(id).value||0;const rr=g('a_rr')/100,mt=g('a_mt')/100,wn=g('a_wn')/100,reach=g('a_reach')/100;let tot=0,rows='';let T=0,R=0,M=0,W=0;
 for(const s of Object.keys(defs)){const n=((A.stream_tier[s].P1||0)+(A.stream_tier[s].P2||0))*reach;const rep=n*rr,mee=rep*mt,won=mee*wn,rev=won*g('d_'+s);T+=n;R+=rep;M+=mee;W+=won;tot+=rev;rows+='<tr><td>'+ST[s]+'</td><td>'+n0(Math.round(n))+'</td><td>'+rep.toFixed(0)+'</td><td>'+mee.toFixed(1)+'</td><td>'+won.toFixed(1)+'</td><td><b>'+n0(Math.round(rev))+'</b></td></tr>'}
 document.getElementById('pm').innerHTML='<div class="big">EUR '+n0(Math.round(tot))+'</div><div class="note">first-deal revenue if all assumptions hold</div><table><tr><th>Stream</th><th>Contacted</th><th>Replies</th><th>Meetings</th><th>Won</th><th>Revenue</th></tr>'+rows+'<tr><td><b>Total</b></td><td>'+n0(Math.round(T))+'</td><td>'+R.toFixed(0)+'</td><td>'+M.toFixed(1)+'</td><td>'+W.toFixed(1)+'</td><td><b>'+n0(Math.round(tot))+'</b></td></tr></table><div class="note">At the engine ramp (40 to 150 DMs/day) 965 targets take about 10 working days to reach.</div>'}
document.querySelectorAll('#s_pipe input').forEach(i=>i.oninput=calc);calc()})();

// TARGETS
(function(){let h='<div class="f"><input id="tq" placeholder="Search name, company, position"><select id="tseg"><option value="">All segments</option>'+Object.entries(SEG).map(e=>'<option value="'+e[0]+'">'+e[1]+'</option>').join('')+'</select><select id="tst"><option value="">All streams</option>'+Object.entries(ST).filter(e=>e[0]!=='-').map(e=>'<option value="'+e[0]+'">'+e[1]+'</option>').join('')+'</select><select id="ttier"><option value="">P1 + P2</option><option>P1</option><option>P2</option></select></div><div class="wrapt"><table id="tt"></table></div><div class="note" id="tn"></div>';
document.getElementById('s_targets').innerHTML=h;
function draw(){const q=tq.value.toLowerCase();const r=A.top.filter(x=>(!tseg.value||x.segment===tseg.value)&&(!tst.value||x.primary_stream===tst.value)&&(!ttier.value||x.tier===ttier.value)&&(!q||(x.name+x.company+x.position).toLowerCase().includes(q)));
 tt.innerHTML='<tr><th>Name</th><th>Position</th><th>Company</th><th>Segment</th><th>Tier</th><th>Score</th><th>Stream</th><th>First offer</th><th>Warmth</th></tr>'+r.slice(0,200).map(x=>'<tr><td><a target="_blank" rel="noopener" href="'+esc(x.linkedin)+'">'+esc(x.name)+'</a></td><td>'+esc(x.position)+'</td><td>'+esc(x.company)+'</td><td>'+esc(SEG[x.segment])+'</td><td><span class="t '+x.tier+'">'+x.tier+'</span></td><td>'+x.opp_score+'</td><td>'+esc(ST[x.primary_stream]||'')+'</td><td>'+esc(x.first_offer)+'</td><td>'+esc(x.warmth)+'</td></tr>').join('');tn.textContent='showing '+Math.min(200,r.length)+' of '+r.length+' (top 400 priority targets embedded; the full list is in all_contacts_scored.csv)'}
['tq','tseg','tst','ttier'].forEach(i=>document.getElementById(i).oninput=draw);draw()})();

// ACCOUNTS
(function(){document.getElementById('s_accounts').innerHTML='<div class="note">Companies ranked by account score: best contact quality plus how many people you know there. Land with the best contact, then expand to the others.</div><div class="wrapt"><table><tr><th>Company</th><th>Contacts</th><th>Buyers</th><th>Senior</th><th>Warm</th><th>Best contact</th><th>Vertical</th><th>Stream</th><th>Score</th></tr>'+A.companies.map(c=>'<tr><td>'+esc(c.company)+'</td><td>'+c.contacts+'</td><td>'+c.buyers+'</td><td>'+c.senior_contacts+'</td><td>'+c.warm_contacts+'</td><td><a target="_blank" rel="noopener" href="'+esc(c.best_linkedin)+'">'+esc(c.best_contact)+'</a> <span class="sub">'+esc(c.best_position)+'</span></td><td>'+esc(c.vertical)+'</td><td>'+esc(ST[c.primary_stream]||'')+'</td><td>'+c.account_score+'</td></tr>').join('')+'</table></div>'})();

// CAMPAIGN
(function(){const c=A.campaign;const order=['NEW','NOT_CONNECTED','IN_SEQUENCE','REPLIED','CONVERSATION','MEETING','PROPOSAL','WON','LOST','NURTURE','DNC'];
let h='';if(c.empty)h+='<div class="warn"><b>Campaign has not started.</b> No touches are planned or sent, so the panels below show only the starting position. They fill in automatically after you run <code>py -m engine sync</code> and rebuild this dashboard.</div>';
h+='<div class="grid k2"><div class="card"><h3>Funnel by stage</h3>'+bars(order.filter(s=>c.stages[s]!==undefined||['IN_SEQUENCE','REPLIED','MEETING','WON'].includes(s)).map(s=>[s,c.stages[s]||0]))+'</div>';
h+='<div class="card"><h3>Touches by status</h3>'+(Object.keys(c.touch_status).length?bars(Object.entries(c.touch_status)):'<div class="note">No touches yet.</div>')+'</div>';
h+='<div class="card"><h3>Sent vs planned, by track</h3>'+(c.by_track.length?'<table><tr><th>Track</th><th>Planned</th><th>Sent</th></tr>'+c.by_track.map(t=>'<tr><td>'+t.track+'</td><td>'+t.planned+'</td><td>'+(t.sent||0)+'</td></tr>').join('')+'</table>':'<div class="note">Will show reply rate per track once replies are logged.</div>')+'</div>';
h+='<div class="card"><h3>A/B variants</h3>'+(c.by_variant.length?'<table><tr><th>Track</th><th>Lang</th><th>Variant</th><th>Sent</th></tr>'+c.by_variant.map(t=>'<tr><td>'+t.track+'</td><td>'+t.lang+'</td><td>'+t.variant+'</td><td>'+(t.sent||0)+'</td></tr>').join('')+'</table>':'<div class="note">The engine picks variants by Thompson sampling. Results appear here after the first replies.</div>')+'</div>';
h+='<div class="card"><h3>Daily sends</h3>'+(c.daily.length?bars(c.daily.map(x=>[x.d,x.sent||0])):'<div class="note">No sends logged. Ramp: 40/day rising to 150/day over about 3 weeks.</div>')+'</div>';
h+='<div class="card"><h3>Reply sentiment</h3>'+(c.replies.length?bars(c.replies.map(r=>[r.sentiment,r.n])):'<div class="note">No replies logged.</div>')+'</div></div>';
h+='<div class="card" style="margin-top:12px"><h3>Reactivation shortlist: P1/P2, dormant, previously two-way threads</h3><div class="wrapt" style="max-height:40vh"><table><tr><th>Name</th><th>Position</th><th>Company</th><th>Stream</th><th>Threads</th><th>Last topics</th></tr>'+A.reactivate.map(x=>'<tr><td><a target="_blank" rel="noopener" href="'+esc(x.linkedin)+'">'+esc(x.name)+'</a></td><td>'+esc(x.position)+'</td><td>'+esc(x.company)+'</td><td>'+esc(ST[x.primary_stream]||'')+'</td><td>'+x.two_way_threads+'</td><td>'+esc(x.topics)+'</td></tr>').join('')+'</table></div></div>';
document.getElementById('s_camp').innerHTML=h})();

// QUALITY
(function(){const o=A.other_total;let h='<div class="warn"><b>How far to trust these numbers.</b> Classification is keyword rules on job title and company only. The LinkedIn export has no headlines or locations. '+n0(o)+' contacts ('+(100*o/A.total).toFixed(0)+'%) match no segment, '+n0(A.no_company)+' have no company, and I have not checked accuracy against a hand-labelled sample.</div><div class="grid k2"><div class="card"><h3>Most common words in unclassified titles</h3>'+bars(A.other_words.slice(0,25))+'<div class="note">Words that look like a real segment are candidates for new rules.</div></div><div class="card"><h3>Sample of unclassified contacts</h3><table>'+A.other_sample.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.position)+'</td><td>'+esc(x.company)+'</td></tr>').join('')+'</table></div></div>';
h+='<div class="card" style="margin-top:12px"><h3>CRM rows to confirm ('+A.crm_review.length+')</h3><div class="note">These CRM people share a name with a LinkedIn contact but not a company or URL, so they are NOT treated as past clients. If one is the right person, paste their LinkedIn URL into that row of data/crm_warm.csv and re-import.</div>'+(A.crm_review.length?'<div class="wrapt" style="max-height:40vh"><table><tr><th>CRM person</th><th>CRM company</th><th>LinkedIn contact</th><th>LinkedIn company</th><th>LinkedIn position</th></tr>'+A.crm_review.map(x=>'<tr><td>'+esc(x.crm_name)+'</td><td>'+esc(x.crm_company)+'</td><td><a target="_blank" rel="noopener" href="'+esc(x.linkedin_url)+'">'+esc(x.linkedin_name)+'</a></td><td>'+esc(x.linkedin_company)+'</td><td>'+esc(x.linkedin_position)+'</td></tr>').join('')+'</table></div>':'<div class="note">Nothing to confirm.</div>')+'</div>';
document.getElementById('s_quality').innerHTML=h})();
let t0='overview';try{t0=localStorage.getItem('tab')||t0}catch(e){}show(t0);
</script></body></html>
